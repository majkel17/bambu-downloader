services:
  bambu-downloader:
    build: .
    image: bambu-downloader:latest
    container_name: bambu-downloader
    restart: unless-stopped
    ports:
      - "8008:8080"
    # Podman (rootless) users: uncomment the line below so your host uid
    # appears inside the container and the bind-mounted downloads/ and data/
    # are writable. Without it you get "attempt to write a readonly database".
    # Docker users: leave this commented out and instead chown the host dirs
    # to 1000:1000 (the container's uid) — see README.
    # userns_mode: keep-id
    volumes:
      # Models land here on the host — point at your printer's sync folder if you like
      - ./downloads:/app/downloads:Z
      # SQLite database + stored Bambu Cloud token
      - ./data:/app/data:Z
    environment:
      - BND_PORT=8080
      # Uncomment to require an X-API-Key header on every /api/* request
      # (recommended on shared networks — set it in the app's Settings tab too):
      # - BND_API_KEY=change-me
      # Read-only key (GET endpoints only) for dashboards like Home Assistant:
      # - BND_READ_API_KEY=change-me-too
      # Seconds between downloads inside a collection sync (anti rate-limit):
      # - BND_DOWNLOAD_DELAY_SECONDS=3
      # How often the scheduler checks for due collections:
      # - BND_SCHEDULER_INTERVAL_SECONDS=300
      # Stop retrying a model in syncs after this many failures caused by the
      # model itself (removed / private / censored); 0 = retry forever:
      # - BND_MAX_DOWNLOAD_ATTEMPTS=3
      # Activity-log retention (days / max entries; 0 = unlimited):
      # - BND_EVENT_RETENTION_DAYS=30
      # - BND_EVENT_MAX_ROWS=5000